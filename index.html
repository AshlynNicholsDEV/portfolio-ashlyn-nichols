<!doctype html>
<html lang="en">
  <head>

    <title>Ashlyn Nichols</title>
    <link rel="stylesheet" href="style.css" />

      rel="icon"

    />

  <body>

        <ul class="nav__link--list">
          <li class="nav__link" onclick="toggleModal()">
            <a

              class="nav__link--anchor link__hover--effect link__hover-effect--black"

              About
            </a>
          </li>
          <li class="nav__link" onclick="toggleModal()">
            <a
              href="#projects"
              class="nav__link--anchor link__hover--effect link__hover-effect--black"

          </li>
          <li class="nav__link" onclick="toggleModal()">
            <a
              href="#contact"

            </a>
          </li>
          <li class="nav__link--click" onclick="toggleContrast()">
            <a
              href="#"

            </a>
          </li>
        </ul>

    </section>
    <header class="header">
      <div class="header__content">
        <h1 class="title">Hey</h1>

        <p class="header__para">

          passion for building beautiful web applications with great user
          experiences.
          <br />
          Here's a bit more
          <b class="pink click" onclick="toggleModal()">about me</b>.
        </p>
        <div class="social__list">
          <a
            href="https://www.linkedin.com/in/ashlyn-nichols31357611"
            target="_blank"
            rel="noopener noreferrer"
            class="social__link--click"
          >
            <i class="fab fa-linkedin"></i>
          </a>
          <a
            href="https://github.com/ashlynnicholsDEV"
            target="_blank"
            rel="noopener noreferrer"
            class="social__link--click"
          >
            <i class="fab fa-github"></i>
          </a>
          <a
            href="assets/ashlyn-nichols-resume.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="social__link--click"
          >
            <i class="fas fa-file-pdf"></i>
          </a>
        </div>
      </div>

    <a href="#"></a>
      <button class="mail__button--click"><i class="fas fa-envelope"></i>
      </button>
    </a>
    <a href="#projects" class="scroll">
      <div class="scroll__icon click"></div>
    </a>
    <div class="modal">
      <div class="modal__half modal__about">
        <h3 class="modal__title modal__title--about">Here's a bit about me</h3>
        <h4 class="modal__sub-title modal__sub-title--about">Frontend Software Engineer.<a href="#projects" class="scroll">
      <div class="scroll__icon--click">
      </div>
    </a>
  </h4>
      </div>
    </div>
